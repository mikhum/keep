<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep Clone Pilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: 'Roboto', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-10">
    <div class="flex items-center space-x-3">
      <span class="material-icons-outlined text-amber-500 text-3xl">lightbulb</span>
      <h1 class="text-xl font-medium text-gray-700">Keep Clone</h1>
    </div>
    <div id="auth-section">
      <button id="login-btn" onclick="handleAuth()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-md shadow-sm transition">
        Anslut Google Drive
      </button>
      <span id="status-indicator" class="hidden text-sm text-emerald-600 font-medium flex items-center">
        <span class="material-icons-outlined text-base mr-1">cloud_done</span> Synkad med Drive
      </span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4">
    <div id="app-content" class="hidden">
      <div class="max-w-xl mx-auto bg-white rounded-lg shadow-md border border-gray-200 p-4 mb-8">
        <input type="text" id="new-title" placeholder="Titel" class="w-full font-medium text-base outline-none mb-2 text-gray-800 placeholder-gray-500">
        <textarea id="new-content" placeholder="Anteckna något..." rows="2" class="w-full text-sm outline-none resize-none text-gray-600 placeholder-gray-500"></textarea>

        <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-100">
          <div class="flex space-x-1" id="color-picker">
            <button onclick="selectColor('#ffffff')" class="w-6 h-6 rounded-full bg-white border border-gray-300 ring-2 ring-blue-500" data-color="#ffffff"></button>
            <button onclick="selectColor('#fef3c7')" class="w-6 h-6 rounded-full bg-amber-100 border border-amber-200" data-color="#fef3c7"></button>
            <button onclick="selectColor('#dcfce7')" class="w-6 h-6 rounded-full bg-green-100 border border-green-200" data-color="#dcfce7"></button>
            <button onclick="selectColor('#e0f2fe')" class="w-6 h-6 rounded-full bg-sky-100 border border-sky-200" data-color="#e0f2fe"></button>
            <button onclick="selectColor('#fce7f3')" class="w-6 h-6 rounded-full bg-pink-100 border border-pink-200" data-color="#fce7f3"></button>
          </div>
          <button onclick="addNote()" class="px-4 py-1.5 bg-gray-900 text-white text-sm font-medium rounded hover:bg-gray-700 transition">
            Spara
          </button>
        </div>
      </div>

      <div id="notes-container" class="columns-1 sm:columns-2 md:columns-3 gap-4 space-y-4">
        </div>
    </div>
  </main>

  <script>
    // Ange ditt gällande Google Client ID nedan
    const CLIENT_ID = '940508107225-2h91m1o4he6r27g1q7hgtaq0f6127dd8.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    
    let accessToken = null;
    let fileId = null;
    let selectedColor = '#ffffff';
    let notesData = { notes: [] };
    let tokenClient;

    window.onload = () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('status-indicator').classList.remove('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            await loadOrInitDriveFile();
          }
        },
      });
    };

    function handleAuth() {
      tokenClient.requestAccessToken();
    }

    function selectColor(color) {
      selectedColor = color;
      document.querySelectorAll('#color-picker button').forEach(btn => {
        btn.classList.toggle('ring-2', btn.dataset.color === color);
        btn.classList.toggle('ring-blue-500', btn.dataset.color === color);
      });
    }

    async function loadOrInitDriveFile() {
      const searchRes = await fetch(
        `https://www.googleapis.com/drive/v3/files?q=name='keep_notes.json' and trashed=false`,
        { headers: { Authorization: `Bearer ${accessToken}` } }
      );
      const searchData = await searchRes.json();

      if (searchData.files && searchData.files.length > 0) {
        fileId = searchData.files[0].id;
        const fileRes = await fetch(
          `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        notesData = await fileRes.json();
      } else {
        await createDriveFile();
      }
      renderNotes();
    }

    async function createDriveFile() {
      const metadata = { name: 'keep_notes.json', mimeType: 'application/json' };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', new Blob([JSON.stringify(notesData)], { type: 'application/json' }));

      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { Authorization: `Bearer ${accessToken}` },
        body: form
      });
      const file = await res.json();
      fileId = file.id;
    }

    async function saveToDrive() {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(notesData)
      });
    }

    async function addNote() {
      const titleInput = document.getElementById('new-title');
      const contentInput = document.getElementById('new-content');

      if (!titleInput.value.trim() && !contentInput.value.trim()) return;

      const newNote = {
        id: Date.now().toString(),
        title: titleInput.value,
        content: contentInput.value,
        color: selectedColor,
        is_completed: false,
        created_at: new Date().toISOString(),
        completed_at: null
      };

      notesData.notes.unshift(newNote);
      titleInput.value = '';
      contentInput.value = '';
      selectColor('#ffffff');
      
      renderNotes();
      await saveToDrive();
    }

    async function toggleComplete(id) {
      const note = notesData.notes.find(n => n.id === id);
      if (note) {
        note.is_completed = !note.is_completed;
        note.completed_at = note.is_completed ? new Date().toISOString() : null;
        renderNotes();
        await saveToDrive();
      }
    }

    async function deleteNote(id) {
      notesData.notes = notesData.notes.filter(n => n.id !== id);
      renderNotes();
      await saveToDrive();
    }

    function formatDate(isoString) {
      if (!isoString) return '';
      const date = new Date(isoString);
      return date.toLocaleString('sv-SE', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function renderNotes() {
      const container = document.getElementById('notes-container');
      container.innerHTML = notesData.notes.map(note => `
        <div class="break-inside-avoid rounded-xl p-4 shadow-sm hover:shadow-md transition border border-gray-200 relative group flex flex-col justify-between" 
             style="background-color: ${note.color}">
          <div>
            ${note.title ? `<h3 class="font-medium text-gray-900 mb-1 ${note.is_completed ? 'line-through text-gray-500' : ''}">${note.title}</h3>` : ''}
            ${note.content ? `<p class="text-sm text-gray-700 whitespace-pre-wrap ${note.is_completed ? 'line-through text-gray-400' : ''}">${note.content}</p>` : ''}
          </div>

          <div class="mt-4 pt-2 border-t border-black/5 text-[11px] text-gray-500 space-y-0.5">
            <div class="flex items-center space-x-1">
              <span class="material-icons-outlined text-xs">add_circle_outline</span>
              <span>Skapad: ${formatDate(note.created_at)}</span>
            </div>
            ${note.completed_at ? `
              <div class="flex items-center space-x-1 text-emerald-700 font-medium">
                <span class="material-icons-outlined text-xs">check_circle_outline</span>
                <span>Klar: ${formatDate(note.completed_at)}</span>
              </div>
            ` : ''}
          </div>

          <div class="mt-2 flex justify-between items-center opacity-90 sm:opacity-0 group-hover:opacity-100 transition-opacity">
            <button onclick="toggleComplete('${note.id}')" title="${note.is_completed ? 'Återöppna' : 'Markera som klar'}" class="p-1 hover:bg-black/5 rounded-full">
              <span class="material-icons-outlined text-sm text-gray-700">
                ${note.is_completed ? 'undo' : 'check'}
              </span>
            </button>
            <button onclick="deleteNote('${note.id}')" title="Ta bort" class="p-1 hover:bg-black/5 rounded-full text-red-600">
              <span class="material-icons-outlined text-sm">delete</span>
            </button>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
