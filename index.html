<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep Clone Pilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: 'Roboto', sans-serif; }
    .drag-over { border-top: 2px solid #3b82f6; }
    .card-drag-over { border-left: 4px solid #3b82f6 !important; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-10">
    <div class="flex items-center space-x-3">
      <span class="material-icons-outlined text-amber-500 text-3xl">lightbulb</span>
      <h1 class="text-xl font-medium text-gray-700">Keep Clone</h1>
    </div>
    <div id="auth-section">
      <button id="login-btn" onclick="handleAuth()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-md shadow-sm transition">
        Anslut Google Drive
      </button>
      <span id="status-indicator" class="hidden text-sm text-emerald-600 font-medium flex items-center">
        <span class="material-icons-outlined text-base mr-1">cloud_done</span> Synkad med Drive
      </span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4">
    <div id="app-content" class="hidden">
      <!-- Skapa nytt kort -->
      <div class="max-w-xl mx-auto bg-white rounded-lg shadow-md border border-gray-200 p-4 mb-8">
        <input type="text" id="new-title" placeholder="Titel" class="w-full font-medium text-base outline-none mb-3 text-gray-800 placeholder-gray-500">
        
        <div id="items-input-container" class="space-y-2 mb-3">
          <div class="flex items-center space-x-2">
            <span class="material-icons-outlined text-gray-400 text-sm">add</span>
            <input type="text" placeholder="Lägg till punkt..." onkeydown="handleItemKeyDown(event)" class="new-item-input w-full text-sm outline-none text-gray-600 placeholder-gray-400 border-b border-transparent focus:border-gray-300 py-0.5">
          </div>
        </div>

        <button onclick="addInputRow()" class="text-xs text-gray-500 hover:text-gray-800 font-medium flex items-center mb-4">
          <span class="material-icons-outlined text-xs mr-1">add</span> Lägg till fler punkter
        </button>

        <div class="flex justify-between items-center pt-2 border-t border-gray-100">
          <div class="flex space-x-1" id="new-color-picker">
            <button onclick="selectNewColor('#ffffff')" class="w-6 h-6 rounded-full bg-white border border-gray-300 ring-2 ring-blue-500" data-color="#ffffff"></button>
            <button onclick="selectNewColor('#fef3c7')" class="w-6 h-6 rounded-full bg-amber-100 border border-amber-200" data-color="#fef3c7"></button>
            <button onclick="selectNewColor('#dcfce7')" class="w-6 h-6 rounded-full bg-green-100 border border-green-200" data-color="#dcfce7"></button>
            <button onclick="selectNewColor('#e0f2fe')" class="w-6 h-6 rounded-full bg-sky-100 border border-sky-200" data-color="#e0f2fe"></button>
            <button onclick="selectNewColor('#fce7f3')" class="w-6 h-6 rounded-full bg-pink-100 border border-pink-200" data-color="#fce7f3"></button>
          </div>
          <button onclick="addNote()" class="px-4 py-1.5 bg-gray-900 text-white text-sm font-medium rounded hover:bg-gray-700 transition">
            Spara
          </button>
        </div>
      </div>

      <!-- Rutnät för aktiva kort -->
      <div id="notes-container" class="columns-1 sm:columns-2 md:columns-3 gap-4 space-y-4"></div>

      <!-- PAPPERSKORG SEKTION -->
      <div id="trash-section" class="mt-16 pt-8 border-t border-gray-300 hidden">
        <h2 class="text-lg font-medium text-gray-600 mb-4 flex items-center">
          <span class="material-icons-outlined mr-2">delete</span> Papperskorg
        </h2>
        <div id="trash-container" class="columns-1 sm:columns-2 md:columns-3 gap-4 space-y-4 opacity-75"></div>
      </div>
    </div>
  </main>

  <!-- REDIGERINGSMODAL (Förstorat läge) -->
  <div id="edit-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div id="modal-card" class="w-full max-w-lg rounded-xl shadow-2xl p-6 relative flex flex-col max-h-[90vh] transition-all">
      
      <button onclick="closeEditModal()" class="absolute top-3 right-3 p-1 rounded-full hover:bg-black/5 text-gray-500">
        <span class="material-icons-outlined">close</span>
      </button>

      <input type="text" id="modal-title" oninput="updateModalNote()" placeholder="Titel" class="font-medium text-lg outline-none bg-transparent mb-4 text-gray-900 pr-8">

      <div class="overflow-y-auto flex-grow space-y-4 pr-1">
        <div>
          <div id="modal-active-items" class="space-y-2"></div>
          
          <div class="flex items-center space-x-2 mt-3 pl-6">
            <span class="material-icons-outlined text-gray-400 text-sm">add</span>
            <input type="text" id="modal-new-item" placeholder="Lägg till punkt..." onkeydown="handleModalAddItem(event)" class="w-full text-sm outline-none bg-transparent border-b border-transparent focus:border-gray-400 py-1">
          </div>
        </div>

        <div id="modal-completed-section" class="pt-4 border-t border-black/10 hidden">
          <div class="text-xs font-medium text-gray-500 mb-2 flex items-center pl-6">
            <span class="material-icons-outlined text-sm mr-1">done_all</span> Avklarade punkter
          </div>
          <div id="modal-completed-items" class="space-y-2"></div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="mt-6 pt-4 border-t border-black/10 flex justify-between items-center">
        <div class="flex space-x-1" id="modal-color-picker">
          <button onclick="changeModalColor('#ffffff')" class="w-6 h-6 rounded-full bg-white border border-gray-300" data-color="#ffffff"></button>
          <button onclick="changeModalColor('#fef3c7')" class="w-6 h-6 rounded-full bg-amber-100 border border-amber-200" data-color="#fef3c7"></button>
          <button onclick="changeModalColor('#dcfce7')" class="w-6 h-6 rounded-full bg-green-100 border border-green-200" data-color="#dcfce7"></button>
          <button onclick="changeModalColor('#e0f2fe')" class="w-6 h-6 rounded-full bg-sky-100 border border-sky-200" data-color="#e0f2fe"></button>
          <button onclick="changeModalColor('#fce7f3')" class="w-6 h-6 rounded-full bg-pink-100 border border-pink-200" data-color="#fce7f3"></button>
        </div>

        <div class="flex items-center space-x-2">
          <button onclick="deleteNoteFromModal()" title="Flytta till papperskorgen" class="p-2 hover:bg-black/5 rounded-full text-red-600 transition">
            <span class="material-icons-outlined">delete</span>
          </button>
          <button onclick="closeEditModal()" class="px-4 py-1.5 bg-gray-900 text-white text-sm font-medium rounded hover:bg-gray-700 transition">
            Klar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CLIENT_ID = '940508107225-2h91m1o4he6r27g1q7hgtaq0f6127dd8.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    
    let accessToken = null;
    let fileId = null;
    let selectedNewColor = '#ffffff';
    let currentEditNoteId = null;
    let draggedItemId = null;
    let draggedCardId = null;
    let notesData = { notes: [], trash: [] };
    let tokenClient;

    window.onload = () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('status-indicator').classList.remove('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            await loadOrInitDriveFile();
          }
        },
      });

      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        auto_select: true,
        callback: () => {
          tokenClient.requestAccessToken({ prompt: '' });
        }
      });

      tokenClient.requestAccessToken({ prompt: '' });
    };

    function handleAuth() {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    function selectNewColor(color) {
      selectedNewColor = color;
      document.querySelectorAll('#new-color-picker button').forEach(btn => {
        btn.classList.toggle('ring-2', btn.dataset.color === color);
        btn.classList.toggle('ring-blue-500', btn.dataset.color === color);
      });
    }

    function addInputRow() {
      const container = document.getElementById('items-input-container');
      const div = document.createElement('div');
      div.className = 'flex items-center space-x-2';
      div.innerHTML = `
        <span class="material-icons-outlined text-gray-400 text-sm">add</span>
        <input type="text" placeholder="Lägg till punkt..." onkeydown="handleItemKeyDown(event)" class="new-item-input w-full text-sm outline-none text-gray-600 placeholder-gray-400 border-b border-transparent focus:border-gray-300 py-0.5">
      `;
      container.appendChild(div);
      div.querySelector('input').focus();
    }

    function handleItemKeyDown(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        addInputRow();
      }
    }

    async function loadOrInitDriveFile() {
      const searchRes = await fetch(
        `https://www.googleapis.com/drive/v3/files?q=name='keep_notes.json' and trashed=false`,
        { headers: { Authorization: `Bearer ${accessToken}` } }
      );
      const searchData = await searchRes.json();

      if (searchData.files && searchData.files.length > 0) {
        fileId = searchData.files[0].id;
        const fileRes = await fetch(
          `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        notesData = await fileRes.json();
        if (!notesData.trash) notesData.trash = [];
      } else {
        await createDriveFile();
      }
      renderNotes();
    }

    async function createDriveFile() {
      const metadata = { name: 'keep_notes.json', mimeType: 'application/json' };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', new Blob([JSON.stringify(notesData)], { type: 'application/json' }));

      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { Authorization: `Bearer ${accessToken}` },
        body: form
      });
      const file = await res.json();
      fileId = file.id;
    }

    async function saveToDrive() {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(notesData)
      });
    }

    async function addNote() {
      const titleInput = document.getElementById('new-title');
      const itemInputs = document.querySelectorAll('.new-item-input');

      const items = [];
      itemInputs.forEach(input => {
        if (input.value.trim()) {
          items.push({
            id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
            text: input.value.trim(),
            is_completed: false,
            created_at: new Date().toISOString(),
            completed_at: null
          });
        }
      });

      if (!titleInput.value.trim() && items.length === 0) return;

      const newNote = {
        id: Date.now().toString(),
        title: titleInput.value.trim(),
        items: items,
        color: selectedNewColor,
        created_at: new Date().toISOString()
      };

      notesData.notes.unshift(newNote);
      
      titleInput.value = '';
      document.getElementById('items-input-container').innerHTML = `
        <div class="flex items-center space-x-2">
          <span class="material-icons-outlined text-gray-400 text-sm">add</span>
          <input type="text" placeholder="Lägg till punkt..." onkeydown="handleItemKeyDown(event)" class="new-item-input w-full text-sm outline-none text-gray-600 placeholder-gray-400 border-b border-transparent focus:border-gray-300 py-0.5">
        </div>
      `;
      selectNewColor('#ffffff');
      
      renderNotes();
      await saveToDrive();
    }

    async function toggleItem(noteId, itemId, event) {
      if(event) event.stopPropagation();
      const note = notesData.notes.find(n => n.id === noteId);
      if (note && note.items) {
        const item = note.items.find(i => i.id === itemId);
        if (item) {
          item.is_completed = !item.is_completed;
          item.completed_at = item.is_completed ? new Date().toISOString() : null;
          renderNotes();
          if (currentEditNoteId === noteId) renderModalContent();
          await saveToDrive();
        }
      }
    }

    async function deleteItem(noteId, itemId) {
      const note = notesData.notes.find(n => n.id === noteId);
      if (note && note.items) {
        note.items = note.items.filter(i => i.id !== itemId);
        renderModalContent();
        renderNotes();
        await saveToDrive();
      }
    }

    async function moveToTrash(id, event) {
      if(event) event.stopPropagation();
      const noteIndex = notesData.notes.findIndex(n => n.id === id);
      if (noteIndex !== -1) {
        const [removedNote] = notesData.notes.splice(noteIndex, 1);
        if (!notesData.trash) notesData.trash = [];
        notesData.trash.unshift(removedNote);
        renderNotes();
        if (currentEditNoteId === id) closeEditModal();
        await saveToDrive();
      }
    }

    function deleteNoteFromModal() {
      if (currentEditNoteId) {
        moveToTrash(currentEditNoteId);
      }
    }

    async function restoreFromTrash(id) {
      const trashIndex = notesData.trash.findIndex(n => n.id === id);
      if (trashIndex !== -1) {
        const [restoredNote] = notesData.trash.splice(trashIndex, 1);
        notesData.notes.unshift(restoredNote);
        renderNotes();
        await saveToDrive();
      }
    }

    async function permanentlyDelete(id) {
      notesData.trash = notesData.trash.filter(n => n.id !== id);
      renderNotes();
      await saveToDrive();
    }

    function formatDate(isoString) {
      if (!isoString) return '';
      const date = new Date(isoString);
      return date.toLocaleString('sv-SE', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    /* MODAL-LOGIK */
    function openEditModal(noteId) {
      currentEditNoteId = noteId;
      renderModalContent();
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      currentEditNoteId = null;
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function renderModalContent() {
      const note = notesData.notes.find(n => n.id === currentEditNoteId);
      if (!note) return;

      const modalCard = document.getElementById('modal-card');
      modalCard.style.backgroundColor = note.color;

      document.getElementById('modal-title').value = note.title || '';

      document.querySelectorAll('#modal-color-picker button').forEach(btn => {
        btn.classList.toggle('ring-2', btn.dataset.color === note.color);
        btn.classList.toggle('ring-blue-500', btn.dataset.color === note.color);
      });

      const activeItemsContainer = document.getElementById('modal-active-items');
      const completedItemsContainer = document.getElementById('modal-completed-items');
      const completedSection = document.getElementById('modal-completed-section');

      const activeItems = note.items ? note.items.filter(i => !i.is_completed) : [];
      const completedItems = note.items ? note.items.filter(i => i.is_completed) : [];

      activeItemsContainer.innerHTML = activeItems.map(item => `
        <div class="flex items-center space-x-2 py-1 px-1 rounded hover:bg-black/5 transition group/item"
             draggable="true" 
             ondragstart="handleItemDragStart(event, '${item.id}')" 
             ondragover="handleItemDragOver(event)" 
             ondragleave="handleItemDragLeave(event)" 
             ondrop="handleItemDrop(event, '${item.id}')">
          <span class="material-icons-outlined text-gray-400 text-sm cursor-grab active:cursor-grabbing">drag_indicator</span>
          <input type="checkbox" onchange="toggleItem('${note.id}', '${item.id}')" class="h-4 w-4 text-blue-600 rounded border-gray-300 cursor-pointer">
          <input type="text" value="${item.text}" onchange="updateItemText('${note.id}', '${item.id}', this.value)" class="w-full text-sm bg-transparent outline-none text-gray-800">
          <button onclick="deleteItem('${note.id}', '${item.id}')" class="text-gray-400 hover:text-red-600 opacity-0 group-hover/item:opacity-100 transition p-0.5">
            <span class="material-icons-outlined text-sm">close</span>
          </button>
        </div>
      `).join('');

      if (completedItems.length > 0) {
        completedSection.classList.remove('hidden');
        completedItemsContainer.innerHTML = completedItems.map(item => `
          <div class="flex items-center justify-between space-x-2 opacity-60 pl-6 group/item">
            <div class="flex items-center space-x-2 flex-grow">
              <input type="checkbox" checked onchange="toggleItem('${note.id}', '${item.id}')" class="h-4 w-4 text-blue-600 rounded border-gray-300">
              <span class="text-sm line-through text-gray-700">${item.text}</span>
            </div>
            <div class="flex items-center space-x-2">
              <span class="text-[10px] text-gray-500 whitespace-nowrap">${formatDate(item.completed_at)}</span>
              <button onclick="deleteItem('${note.id}', '${item.id}')" class="text-gray-400 hover:text-red-600 opacity-0 group-hover/item:opacity-100 transition p-0.5">
                <span class="material-icons-outlined text-sm">close</span>
              </button>
            </div>
          </div>
        `).join('');
      } else {
        completedSection.classList.add('hidden');
      }
    }

    /* DRAG & DROP FÖR ENSTAKA PUNKTER INNE I MODALEN */
    function handleItemDragStart(event, itemId) {
      draggedItemId = itemId;
      event.dataTransfer.effectAllowed = 'move';
      event.stopPropagation();
    }

    function handleItemDragOver(event) {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      event.currentTarget.classList.add('drag-over');
      event.stopPropagation();
    }

    function handleItemDragLeave(event) {
      event.currentTarget.classList.remove('drag-over');
      event.stopPropagation();
    }

    async function handleItemDrop(event, targetItemId) {
      event.preventDefault();
      event.stopPropagation();
      event.currentTarget.classList.remove('drag-over');

      if (!draggedItemId || draggedItemId === targetItemId) return;

      const note = notesData.notes.find(n => n.id === currentEditNoteId);
      if (note && note.items) {
        const draggedIndex = note.items.findIndex(i => i.id === draggedItemId);
        const targetIndex = note.items.findIndex(i => i.id === targetItemId);

        if (draggedIndex !== -1 && targetIndex !== -1) {
          const [draggedItem] = note.items.splice(draggedIndex, 1);
          note.items.splice(targetIndex, 0, draggedItem);

          renderModalContent();
          renderNotes();
          await saveToDrive();
        }
      }
      draggedItemId = null;
    }

    /* DRAG & DROP FÖR HELA KORT I RUTNÄTET */
    function handleCardDragStart(event, cardId) {
      draggedCardId = cardId;
      event.dataTransfer.effectAllowed = 'move';
    }

    function handleCardDragOver(event) {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      event.currentTarget.classList.add('card-drag-over');
    }

    function handleCardDragLeave(event) {
      event.currentTarget.classList.remove('card-drag-over');
    }

    async function handleCardDrop(event, targetCardId) {
      event.preventDefault();
      event.currentTarget.classList.remove('card-drag-over');

      if (!draggedCardId || draggedCardId === targetCardId) return;

      const draggedIndex = notesData.notes.findIndex(n => n.id === draggedCardId);
      const targetIndex = notesData.notes.findIndex(n => n.id === targetCardId);

      if (draggedIndex !== -1 && targetIndex !== -1) {
        const [draggedCard] = notesData.notes.splice(draggedIndex, 1);
        notesData.notes.splice(targetIndex, 0, draggedCard);

        renderNotes();
        await saveToDrive();
      }
      draggedCardId = null;
    }

    async function updateModalNote() {
      const note = notesData.notes.find(n => n.id === currentEditNoteId);
      if (note) {
        note.title = document.getElementById('modal-title').value;
        renderNotes();
        await saveToDrive();
      }
    }

    async function changeModalColor(color) {
      const note = notesData.notes.find(n => n.id === currentEditNoteId);
      if (note) {
        note.color = color;
        renderModalContent();
        renderNotes();
        await saveToDrive();
      }
    }

    async function handleModalAddItem(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        const input = document.getElementById('modal-new-item');
        if (!input.value.trim()) return;

        const note = notesData.notes.find(n => n.id === currentEditNoteId);
        if (note) {
          if (!note.items) note.items = [];
          note.items.push({
            id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
            text: input.value.trim(),
            is_completed: false,
            created_at: new Date().toISOString(),
            completed_at: null
          });
          input.value = '';
          renderModalContent();
          renderNotes();
          await saveToDrive();
        }
      }
    }

    async function updateItemText(noteId, itemId, newText) {
      const note = notesData.notes.find(n => n.id === noteId);
      if (note && note.items) {
        const item = note.items.find(i => i.id === itemId);
        if (item) {
          item.text = newText;
          renderNotes();
          await saveToDrive();
        }
      }
    }

    function renderNotes() {
      const container = document.getElementById('notes-container');
      container.innerHTML = notesData.notes.map(note => {
        const hasItems = note.items && note.items.length > 0;
        const activeItems = hasItems ? note.items.filter(i => !i.is_completed) : [];
        const completedItems = hasItems ? note.items.filter(i => i.is_completed) : [];

        return `
          <div onclick="openEditModal('${note.id}')" 
               draggable="true"
               ondragstart="handleCardDragStart(event, '${note.id}')"
               ondragover="handleCardDragOver(event)"
               ondragleave="handleCardDragLeave(event)"
               ondrop="handleCardDrop(event, '${note.id}')"
               class="break-inside-avoid rounded-xl p-4 shadow-sm hover:shadow-md transition border border-gray-200 relative group flex flex-col justify-between cursor-grab active:cursor-grabbing" 
               style="background-color: ${note.color}">
            <div>
              ${note.title ? `<h3 class="font-medium text-gray-900 mb-2">${note.title}</h3>` : ''}
              
              <div class="space-y-1.5 mb-2">
                ${activeItems.map(item => `
                  <div class="flex items-start space-x-2">
                    <input type="checkbox" onchange="toggleItem('${note.id}', '${item.id}', event)" class="mt-1 h-3.5 w-3.5 text-blue-600 rounded border-gray-300 cursor-pointer">
                    <span class="text-sm text-gray-700 break-words">${item.text}</span>
                  </div>
                `).join('')}
              </div>

              ${completedItems.length > 0 ? `
                <div class="mt-2 pt-2 border-t border-black/5 text-xs text-gray-500">
                  <span class="line-through">${completedItems.length} avklarade punkter</span>
                </div>
              ` : ''}
            </div>

            <div class="mt-3 pt-2 border-t border-black/5 text-[11px] text-gray-500 space-y-0.5">
              <div class="flex items-center space-x-1">
                <span class="material-icons-outlined text-xs">add_circle_outline</span>
                <span>Skapad: ${formatDate(note.created_at)}</span>
              </div>
            </div>

            <div class="mt-2 flex justify-end items-center opacity-90 sm:opacity-0 group-hover:opacity-100 transition-opacity">
              <button onclick="moveToTrash('${note.id}', event)" title="Flytta till papperskorgen" class="p-1 hover:bg-black/5 rounded-full text-red-600">
                <span class="material-icons-outlined text-sm">delete</span>
              </button>
            </div>
          </div>
        `;
      }).join('');

      const trashSection = document.getElementById('trash-section');
      const trashContainer = document.getElementById('trash-container');

      if (notesData.trash && notesData.trash.length > 0) {
        trashSection.classList.remove('hidden');
        trashContainer.innerHTML = notesData.trash.map(note => `
          <div class="break-inside-avoid rounded-xl p-4 border border-gray-300 relative flex flex-col justify-between" 
               style="background-color: ${note.color}">
            <div>
              ${note.title ? `<h3 class="font-medium text-gray-700 mb-2">${note.title}</h3>` : ''}
              <div class="space-y-1 mb-2 text-sm text-gray-600">
                ${(note.items || []).map(i => `<div>• ${i.text}</div>`).join('')}
              </div>
            </div>

            <div class="mt-4 pt-2 border-t border-black/5 flex justify-between items-center">
              <button onclick="restoreFromTrash('${note.id}')" title="Återställ kort" class="text-xs font-medium text-blue-600 hover:text-blue-800 flex items-center">
                <span class="material-icons-outlined text-sm mr-1">restore</span> Återställ
              </button>
              <button onclick="permanentlyDelete('${note.id}')" title="Radera permanent" class="text-xs font-medium text-red-600 hover:text-red-800 flex items-center">
                <span class="material-icons-outlined text-sm mr-1">delete_forever</span> Radera permanent
              </button>
            </div>
          </div>
        `).join('');
      } else {
        trashSection.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
